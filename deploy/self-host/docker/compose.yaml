name: kitsune
services:
  app:
    image: ${KITSUNE_IMAGE:?Set KITSUNE_IMAGE to the verified local Kitsune image}
    pull_policy: never
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KITSUNE_PORT:-8080}:8080"
    environment:
      KITSUNE_APP_URL: ${KITSUNE_APP_URL:-http://localhost:${KITSUNE_PORT:-8080}}
    volumes:
      - data:/var/lib/kitsune
volumes:
  data:
