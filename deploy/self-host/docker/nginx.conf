worker_processes 1;
pid /tmp/kitsune-nginx.pid;
error_log /dev/stderr error;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_body_temp_path /var/cache/kitsune/client;
    proxy_temp_path /var/cache/kitsune/proxy;
    fastcgi_temp_path /var/cache/kitsune/fastcgi;
    uwsgi_temp_path /var/cache/kitsune/uwsgi;
    scgi_temp_path /var/cache/kitsune/scgi;
    server {
        include /tmp/kitsune-listen.conf;
        server_name _;
        server_tokens off;
        root /srv/kitsune/public;
        index index.php;
        client_max_body_size 24m;
        location / { try_files $uri $uri/ /index.php?$query_string; }
        location = /index.php {
            include /etc/kitsune/fastcgi_params;
            # Use the parsed request host and the operator-configured external port.
            fastcgi_param HTTP_HOST $host$kitsune_origin_port;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_pass 127.0.0.1:9000;
        }
        location ~ \.php(?:/|$) { return 404; }
        location ~ /\. { deny all; }
    }
}
