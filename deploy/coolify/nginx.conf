# Only the dedicated cloudflared sidecar shares this network namespace.
# There is no published port and no HTTP hop between the connector and PHP's web server.
log_format kitsune_safe '$time_iso8601 $request_method $status $body_bytes_sent $request_time';
server {
    listen 127.0.0.1:8443 ssl default_server;
    server_name development.kitsunecms.org;
    ssl_certificate /run/kitsune-tls/server.crt;
    ssl_certificate_key /run/kitsune-tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($http_host !~* "^development\.kitsunecms\.org(:443)?$") { return 421; }
    root /srv/kitsune/skeleton/public;
    index index.php;
    server_tokens off;
    client_max_body_size 20m;
    access_log /dev/stdout kitsune_safe;
    error_log /dev/stderr error;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param SERVER_PORT 443;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 45s;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
