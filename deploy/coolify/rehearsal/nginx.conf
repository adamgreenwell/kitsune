worker_processes 1;
pid /tmp/kitsune-rehearsal-nginx.pid;
error_log /tmp/kitsune-rehearsal-nginx-error.log warn;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_body_temp_path /var/cache/kitsune-rehearsal/client;
    proxy_temp_path /var/cache/kitsune-rehearsal/proxy;
    fastcgi_temp_path /var/cache/kitsune-rehearsal/fastcgi;
    uwsgi_temp_path /var/cache/kitsune-rehearsal/uwsgi;
    scgi_temp_path /var/cache/kitsune-rehearsal/scgi;
    server {
        listen 127.0.0.1:8443 ssl;
        ssl_certificate /run/kitsune-rehearsal-origin/current/server.crt;
        ssl_certificate_key /run/kitsune-rehearsal-origin/current/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        include /tmp/kitsune-rehearsal-origin.conf;
        server_tokens off;
        root /srv/kitsune/app/public;
        index index.php;
        client_max_body_size 8m;
        location / { try_files $uri $uri/ /index.php?$query_string; }
        location = /index.php {
            include /etc/nginx/fastcgi_params;
            fastcgi_param HTTP_HOST $host;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_pass 127.0.0.1:9000;
        }
        location ~ \.php(?:/|$) { return 404; }
        location ~ /\. { deny all; }
    }
}
