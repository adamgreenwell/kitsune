name: CLA

# Records a contributor's agreement to CLA.md on their first pull request (ADR-005).
#
# ⚠️ DISABLED UNTIL COUNSEL HAS SIGNED OFF. The job below is gated on a repository
# variable, so enabling it is a settings change rather than a code change:
#
#   Settings → Secrets and variables → Actions → Variables → CLA_ENABLED = true
#
# Do not enable it before the checklist at the bottom of CLA.md is complete. A bot
# collecting signatures against an unvetted agreement is worse than no bot: it produces a
# record that looks like consent and may not be.
#
# SETUP REQUIRED before enabling:
#   1. Complete the checklist at the end of CLA.md, including the grantee question. Activation
#      is the step AFTER that list rather than an item in it — an "enable the bot" checkbox
#      inside a list that gates enabling the bot can never be ticked, which review caught.
#   2. Add a secret PERSONAL_ACCESS_TOKEN — a fine-grained PAT scoped to THIS repository
#      with Contents: read and write, so the action can append to the signatures file.
#      Not the classic `repo` scope: this needs one repository, not all of them.
#   3. Flip CLA_ENABLED to true
#
# ⚠️ `pull_request_target` IS DELIBERATE AND IS ALSO THE DANGEROUS PART. It is required
# because a pull request from a fork must be able to record a signature, and
# `pull_request` grants no write access for forks. But `pull_request_target` runs with
# this repository's secrets in the context of the BASE branch — so it must never check out
# or execute the pull request's code. There is no `actions/checkout` step below, and one
# must never be added here: that is the standard route to handing a fork's code this
# repository's token (AGENTS.md invariant 6 — anything reachable from outside is
# untrusted, and a fork's branch is reachable by anyone).

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Check or record the agreement
    runs-on: ubuntu-latest
    # The gate. Absent the variable this evaluates false and the job is skipped, which is
    # the state the repository ships in.
    if: vars.CLA_ENABLED == 'true'
    steps:
      - name: Check or record the agreement
        if: (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # ⚠️ PINNED TO A COMMIT, NOT A TAG, and the difference is load-bearing here. This step
        # receives a repository-scoped write PAT and a write-enabled GITHUB_TOKEN, so if the
        # upstream tag moved it would silently run different code with those credentials — and
        # the seven-field disclosure in CLA.md could change with no pin change to prompt a
        # re-read. A tag is a pointer; a SHA is the code. Review caught that the note below
        # asked for a re-read "if the version pin moves", which a moved tag does not do.
        #
        # ca4a40a is v2.6.1. Updating this SHA REQUIRES re-reading the signature record in the
        # new dist and updating CLA.md's table, because that table is a promise to contributors.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Writes the signatures file. See SETUP REQUIRED above for its scope.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          # ⚠️ Signatures live on a BRANCH of this repository rather than in the default
          # branch, so recording one never touches main and never triggers CI.
          branch: cla-signatures
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/adamgreenwell/kitsune/blob/main/CLA.md
          # ⚠️ The action decides what it stores, not this file, and the pinned commit records
          # SEVEN fields: `name` (login), `id` (numeric user id), `comment_id`, `body` (the
          # signing sentence, lowercased), `created_at`, `repoId` and `pullRequestNo`. Read out
          # of the pinned dist rather than its docs. CLA.md discloses that table to
          # contributors; changing the SHA above means re-reading the source and updating that
          # table, because the promise made there is the thing that has to stay true.
          #
          # No email address, postal address or employer: the reasoning `pii_class` applies to
          # an org's fields (ADR-020) applies to the project's own records too.
          create-file-commit-message: 'chore(cla): start the signatures file'
          signed-commit-message: 'chore(cla): record $contributorName agreeing to the CLA'
          custom-notsigned-prcomment: >
            Thanks for this. Kitsune CMS asks contributors to agree to its
            [Contributor License Agreement](https://github.com/adamgreenwell/kitsune/blob/main/CLA.md)
            before a pull request is merged — `CONTRIBUTING.md` explains why in plain terms,
            including what it means for you. If you would rather not, that is a reasonable
            position and issues and review are still genuinely welcome.
          custom-allsigned-prcomment: 'All contributors have agreed to the CLA. Thank you.'
          # Bots do not hold copyright.
          allowlist: dependabot[bot],github-actions[bot]
