name: Split packages

# Publishes each package in packages/* to its own read-only mirror when a release is tagged, the way
# laravel/framework publishes illuminate/*: a `git subtree split`, so the mirror carries the package's real
# history. Contributions go through this monorepo; the mirrors take no pull requests.
#
# SETUP REQUIRED before this can run:
#   1. Create the `kitsunecms` GitHub organisation, then an EMPTY public repository `kitsunecms/core`
#      inside it — no README, licence or .gitignore. The split is pushed without force, so a mirror with a
#      commit of its own is refused rather than silently replaced; creating it empty is what lets the first
#      release through.
#   2. On THIS repository, add a secret ACCESS_TOKEN. Prefer a fine-grained PAT
#      scoped to `kitsunecms/core` alone with Contents: read and write — a
#      classic `repo`-scope token grants write access to every repository the
#      owner has, and this needs exactly one. Fine-grained tokens must be
#      permitted in the org's settings; otherwise a classic PAT is the fallback.
#   3. Register `kitsune/core` on Packagist pointed at the MIRROR, not at this
#      monorepo, and add Packagist's webhook so it updates on push.
#
# Until then this workflow is inert: it fires only on a `v*` tag, and none exist.
#
# ⚠️ IT WAS A MARKETPLACE ACTION, AND RUNNING IT FOUND SEVEN DEFECTS (issue #8). Following step 1 as it was then
# written made the first release fail and publish nothing; a manual dispatch from a branch pushed unreleased
# code to the mirror's main; every tag rewrote main, so a release published late dragged it backwards; the tag
# name reached a shell unescaped, in the job holding the write token; that job ran third-party code by a movable
# tag; and this comment described a force-pushed, history-preserving split the action did not perform. The
# publishing is now `.github/scripts/split-package.sh`, which does what this comment says, and is exercised
# against a real bare repository by `tests/Core/Release/SplitPackageScriptTest.php` on every pull request.
#
# ⚠️ AND THERE IS NO CONCURRENCY GROUP, DELIBERATELY. A group queues only one pending run and cancels any older
# pending one, so three tags pushed together would silently lose the middle release. Runs may overlap instead:
# tags are distinct refs, and the script moves main without force, re-reading the mirror when it loses a race.
#
# ⚠️ The mirror lives in an ORGANISATION rather than a personal namespace, and
# the name is deliberate. `adamgreenwell/core` said nothing about the project and
# would not have scaled — a second split package would have been another
# unqualified name with no association to the first. GOVERNANCE.md also commits
# to sharing repository and Packagist access at the second maintainer, which is a
# permissions change in an org and a repo transfer without one.
#
# The Composer name stays `kitsune/core`: the vendor is unclaimed on Packagist,
# it is already what the skeleton depends on and what the roadmap names, and a
# Composer vendor need not match a GitHub org.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  split:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: core
            repository: core

    steps:
      # ⚠️ PINNED BY COMMIT, because this job holds a token that can write to the mirror, and a tag can be moved.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The whole history: the split replays it, and the script asks whether the tag is on main.
          fetch-depth: 0
          # The mirror is pushed with its own token; this repository's needs nowhere to be kept.
          persist-credentials: false

      # Tests deliberately live at the monorepo root, not inside the package
      # (Pest resolves its test directory from the project root with no config
      # hook), so the mirror carries source without a suite. That is the same
      # arrangement illuminate/* have, and why the mirror is read-only.
      #
      # ⚠️ Every value reaches the script through `env`, never interpolated into `run`: a tag's name is data.
      - name: Split packages/${{ matrix.package }}
        env:
          TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          PREFIX: packages/${{ matrix.package }}
          MAIN_REF: origin/main
          REMOTE: https://x-access-token:${{ secrets.ACCESS_TOKEN }}@github.com/kitsunecms/${{ matrix.repository }}.git
        run: bash .github/scripts/split-package.sh
