name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ⚠️ EVERY JOB HAS A CEILING, SET ABOVE ITS SLOW TAIL RATHER THAN ITS MEDIAN.
# Without one, a job that has truly stopped runs to GitHub's six-hour default
# and holds up every PR behind it. With one near the median, green runs fail:
# across 25 successful runs the MySQL lanes took a median of 14-16 minutes and
# as long as 58.7, and a later one took 73.9 (run 34913818861). Slowest
# successful run per job, in minutes: lint 0.7, bare clone 1.4, sqlite 2.1,
# pgsql 9.8, mariadb 27.0, mysql 73.9, Playwright 3.2. Every figure predates
# migrating the test schema once per process; re-measure before lowering one.
jobs:
  lint:
    name: Pint + PHPStan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: ramsey/composer-install@4.0.0

      - run: vendor/bin/pint --test
      # The skeleton is a separate published package with Laravel's own
      # conventions - its entrypoints are copied verbatim from laravel/laravel
      # and reformatting them would diverge from upstream for no benefit.
      - run: vendor/bin/pint --test skeleton --config skeleton/pint.json
      - run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress

  # ADR-024's pillar-three mitigation, enforced rather than asserted.
  #
  # No service containers are declared for this job on purpose. If the default
  # suite ever needs a database server, Docker or Node, this job goes red and
  # the bare-clone promise in CONTRIBUTING has been broken. Do not "fix" a
  # failure here by adding services - fix the test that reached for one.
  bare-clone:
    name: Bare clone (PHP ${{ matrix.php }}, no services)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, mbstring
          coverage: none

      - uses: ramsey/composer-install@4.0.0

      - name: Run the default suite with nothing else available
        run: vendor/bin/pest --colors=always

  engines:
    name: PHP ${{ matrix.php }} / ${{ matrix.engine }}
    runs-on: ubuntu-latest
    # The widest ceiling, for the slowest lane (see the top of this file). Some runner VMs slow MySQL 3-8x, and one
    # run was cancelled here while still passing tests. Raising this hides that; see "Describe the runner".
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        # ⚠️ mariadb is in the matrix because README, architecture.md and
        # roadmap.md all document it as supported and DriverFactory routes it
        # to MySqlDriver — and nothing ran against it, so two MySQL-only
        # constructs had shipped: the `->>` operator, which MariaDB does not
        # have, and `CAST(... AS JSON)`, which it rejects. Documented support
        # that is never exercised is a claim, not a feature.
        engine: [sqlite, pgsql, mysql, mariadb]

    # ⚠️ ONLY THE LANE'S OWN DATABASE STARTS. Every engine job used to start all three
    # service containers, so the sqlite lane booted PostgreSQL, MySQL and MariaDB and
    # connected to none of them. An empty image is GitHub's documented way to leave a
    # service unstarted: "If jobs.<job_id>.services.<service_id>.image is assigned an
    # empty string, the service will not start."
    services:
      postgres:
        image: ${{ matrix.engine == 'pgsql' && 'postgres:17-alpine' || '' }}
        env:
          POSTGRES_DB: kitsune
          POSTGRES_USER: kitsune
          POSTGRES_PASSWORD: kitsune
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kitsune"
          --health-interval 3s --health-timeout 3s --health-retries 20

      mysql:
        image: ${{ matrix.engine == 'mysql' && 'mysql:8.4' || '' }}
        env:
          MYSQL_DATABASE: kitsune
          MYSQL_USER: kitsune
          MYSQL_PASSWORD: kitsune
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ukitsune -pkitsune"
          --health-interval 3s --health-timeout 3s --health-retries 20

      mariadb:
        image: ${{ matrix.engine == 'mariadb' && 'mariadb:10.6' || '' }}
        env:
          MARIADB_DATABASE: kitsune
          MARIADB_USER: kitsune
          MARIADB_PASSWORD: kitsune
          MARIADB_ROOT_PASSWORD: root
        ports: ['3307:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 3s --health-timeout 3s --health-retries 20

    steps:
      - uses: actions/checkout@v5

      # Names the VM class and its synced-write speed, so a slow lane can be told apart from a slow change.
      - name: Describe the runner
        run: |
          grep -m1 'model name' /proc/cpuinfo
          echo "cpus: $(nproc)"
          for flag in avx512f rtm; do grep -qw "$flag" /proc/cpuinfo && echo "$flag: yes" || echo "$flag: no"; done
          dd if=/dev/zero of="$RUNNER_TEMP/dsync-probe" bs=4k count=1000 oflag=dsync 2>&1 | tail -1
          rm -f "$RUNNER_TEMP/dsync-probe"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, pdo_pgsql, pdo_mysql, mbstring
          coverage: none

      - uses: ramsey/composer-install@4.0.0

      - name: Run the suite against ${{ matrix.engine }}
        env:
          DB_CONNECTION: ${{ matrix.engine == 'sqlite' && 'testing' || matrix.engine }}
          DB_HOST: 127.0.0.1
          DB_PORT: >-
            ${{ matrix.engine == 'pgsql' && '5432'
             || matrix.engine == 'mariadb' && '3307'
             || '3306' }}
          DB_DATABASE: kitsune
          DB_USERNAME: kitsune
          DB_PASSWORD: kitsune
        run: vendor/bin/pest --colors=always

  # The only job with Node anywhere near it. ADR-024 keeps the browser layer
  # narrow on purpose: it exists for the class of defect the PHP suite
  # structurally cannot see - URL generation across page boundaries, and
  # anything that only appears once a page actually renders.
  #
  # ⚠️ ON BOTH PHP VERSIONS, BECAUSE IT IS THE ONLY JOB THAT BOOTS THE SKELETON.
  # The PHP suites already ran on 8.5, but through Testbench: the skeleton's own
  # bootstrap, the Filament panel and Livewire had never started on 8.5 here,
  # while the alpha's stage server runs 8.5 (ADR-013 amendment).
  browser:
    name: Playwright (PHP ${{ matrix.php }}, skeleton smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, mbstring
          coverage: none

      # kitsune/core is not on Packagist yet (#8), so the skeleton resolves it
      # from a path repository injected into this ephemeral checkout. The
      # committed skeleton/composer.json stays clean - a path repository whose
      # url does not exist is a hard error, not a warning, so it must never
      # ship in the published package.
      - name: Install the skeleton
        run: composer skeleton:install --no-interaction

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          # One name per PHP version: a second upload under the same name conflicts.
          name: playwright-report-php-${{ matrix.php }}
          path: playwright-report/
          retention-days: 7
