name: Wiki sync

# The wiki's generated pages are derived from docs/, so they are regenerated
# whenever docs/ changes rather than by remembering to run a script. A wiki
# kept in sync by discipline drifts; one kept in sync by a workflow does not.
#
# Hand-written wiki pages are never touched - the generator only writes the
# files it owns, and those carry a do-not-edit banner.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'bin/wiki-sync.php'
      - '.github/workflows/wiki-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Regenerate derived wiki pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Check out the wiki
        run: |
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" wiki

      - name: Regenerate
        run: php bin/wiki-sync.php wiki

      - name: Commit and push if anything changed
        working-directory: wiki
        run: |
          if git diff --quiet; then
            echo "wiki already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync derived pages from docs/ (${GITHUB_SHA::7})"
          git push
